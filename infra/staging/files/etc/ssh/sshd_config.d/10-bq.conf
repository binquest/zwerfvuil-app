# Managed by infra/staging (zwerfvuil-app).
# Key-only login, only for the deploy user. sshd uses the first value it
# reads and this file is included at the top of sshd_config, so these win.
# TCP forwarding stays on: Studio and Postgres are reached through SSH tunnels.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers deploy
MaxAuthTries 3
X11Forwarding no
